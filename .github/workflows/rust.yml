name: Push or PR

on:
  [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_n_test:
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest, windows-latest

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: rustfmt
      run: cargo fmt --all -- --check
    - name: check
      run: cargo check --locked --verbose
    - name: clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Build
      run: cargo build --locked --verbose --examples --tests --all-features
    - name: Test
      run: cargo test --locked --all-features --examples
